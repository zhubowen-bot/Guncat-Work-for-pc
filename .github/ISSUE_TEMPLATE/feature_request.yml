name: 功能建议
description: 提出一个新功能、改进或新的工具 / 技能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法。为了让讨论更有效率，请说明**你遇到的是什么问题**，
        而不只是「我想要一个 X 功能」—— 同一个问题往往有更好的解法。

        这个项目是鸿蒙版 Guncat Work 的桌面移植，**与上游保持一致**是一条硬约束：
        如果你建议的改动会让桌面版在某处偏离鸿蒙版，请一并说明为什么值得偏离
        （这类分歧要登记进 `docs/PORTING.md` 的移植补丁清单）。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 现在这样做有什么不便？在什么场景下？
      placeholder: |
        例如：长任务跑到一半我想换模型，但现在只能停掉重来。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的设想
      description: 你希望它怎么工作？（有方案更好，没有也没关系）
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      description: 你觉得这个改动落在哪一块？
      options:
        - 交互模式（Intelligent UI）
        - 工作模式（Agent Loop / 工具 / 技能）
        - 聊天模式与智能体
        - Office / PDF 生成与解析
        - 桌面端外壳（窗口、菜单、托盘、文件收件）
        - 界面与交互体验
        - 工程 / 构建 / 打包 / 测试
        - 文档
        - 其他 / 不确定
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: 上游鸿蒙版是否已有此能力
      description: 如果上游已有而桌面版没有，这属于「对标缺口」，优先级通常更高
      options:
        - 上游已有，桌面版缺失（对标缺口）
        - 上游也没有，是全新想法
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 有没有别的做法能达到同样目的？

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现它（可以先在 Issue 里对齐方案）
        - label: 我只提建议，暂时没时间动手
